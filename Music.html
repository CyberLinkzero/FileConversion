<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Music → Tabs & Sheet (Local)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Analyze an audio file locally and render simple guitar tabs, bass lines, piano notes, and a lead sheet." />

  <!-- Optional: your global CSS -->
  <link rel="stylesheet" href="site.css" />

  <style>
    :root {
      --bg: #0f1117;
      --panel: #111827;
      --ink: #e5f2ff;
      --muted: #9ca3af;
      --line: #1f2937;
      --cyan: #67e8f9;
      --vio: #a78bfa;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #020617 0, #020617 25%, #020617 35%, #020617 100%);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      padding: 22px 16px;
      text-align: center;
      border-bottom: 1px solid #111827;
      background: radial-gradient(circle at top, #020617 0, #020617 35%, #020617 100%);
    }
    header h1 {
      margin: 0;
      font-size: 26px;
      background: linear-gradient(90deg, #67e8f9, #a855f7, #22c55e);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 16px 64px;
    }

    .card {
      background: linear-gradient(180deg, #020617, #020617);
      border-radius: 18px;
      border: 1px solid #111827;
      box-shadow: 0 0 35px rgba(15, 23, 42, 0.8);
      margin-bottom: 18px;
    }
    .pad { padding: 18px; }

    .row {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 900px) {

        grid-template-columns: 1fr;

    label.title {
      display: block;
      font-size: 13px;
      color: #cbd5f5;
      margin: 8px 0 6px;
    }

    .drop {

      border-radius: 14px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      background: radial-gradient(circle at top, rgba(103,232,249,0.12) 0, transparent 55%);

    .chip {

      border-radius: 999px;
      border: 1px solid #1f2937;
      font-size: 12px;
      background: #020617;
      color: var(--muted);
    }

    textarea {

    }

      display: flex;

    }

    .btn {

<body>
<header>
  <h1>Music → Tabs & Sheet (Local)</h1>
  <p>Analyze an audio file once, then export guitar tabs, bass/piano hints, and a simple lead sheet. All in your browser.</p>

  <!-- Keep your nav + utils if you use them elsewhere -->
  <div data-nav-placeholder></div>
  <script src="nav-loader.js" defer></script>
  <script src="js/utils.js" defer></script>
</header>

<div class="wrap">
  <!-- Input / options -->

    <div class="pad">
      <div class="row">

            <div class="small-note" style="margin-top:6px;">
              Selected: <span id="fname" class="badge-lite">none</span>
            </div>
          </div>

          <div class="actions">
            <button id="analyzeBtn" class="btn">Analyze (one pass)</button>
            <button id="abortBtn" class="btn outline" disabled>Abort</button>
          </div>
          <div class="progress">

          </div>

            <label class="chip">

              Sheet music

            <label class="chip"><input id="guitarChk" type="checkbox" checked /> Guitar</label>
            <label class="chip"><input id="bassChk"   type="checkbox" checked /> Bass</label>
            <label class="chip"><input id="pianoChk"  type="checkbox" /> Piano</label>
            <label class="chip"><input id="drumsChk"  type="checkbox" /> Drums</label>
          </div>

          <label class="title" style="margin-top:10px;">Exports</label>
          <div class="chips">
            <label class="chip"><input id="fmt-md"   type="checkbox" checked /> Markdown</label>
            <label class="chip"><input id="fmt-txt"  type="checkbox" /> Plain text</label>
            <label class="chip"><input id="fmt-json" type="checkbox" /> JSON</label>
            <label class="chip"><input id="fmt-vtt"  type="checkbox" /> WebVTT</label>

          <div class="chips">

<script type="module">
/* ========= DOM refs ========= */
const fileEl       = document.getElementById('file');
const dropEl       = document.getElementById('drop');
const pickBtn      = document.getElementById('pickBtn');
const fnameEl      = document.getElementById('fname');
const analyzeBtn   = document.getElementById('analyzeBtn');
const abortBtn     = document.getElementById('abortBtn');
const renderBtn    = document.getElementById('renderBtn');
const progressFill = document.getElementById('progressFill');
const statusEl     = document.getElementById('status');
const lyricsEl     = document.getElementById('lyrics');
const previewEl    = document.getElementById('preview');
const logEl        = document.getElementById('log');
const scoreWrap    = document.getElementById('scoreWrap');
const scoreCanvas  = document.getElementById('scoreCanvas');

const modeRadios   = document.querySelectorAll('input[name="mode"]');
const vocalsChk    = document.getElementById('vocals');
const guitarChk    = document.getElementById('guitarChk');
const bassChk      = document.getElementById('bassChk');
const pianoChk     = document.getElementById('pianoChk');
const drumsChk     = document.getElementById('drumsChk');

const fmtMd        = document.getElementById('fmt-md');
const fmtTxt       = document.getElementById('fmt-txt');
const fmtJSON      = document.getElementById('fmt-json');
const fmtVTT       = document.getElementById('fmt-vtt');
const splitSel     = document.getElementById('force-split');

const getMode = () => (document.querySelector('input[name="mode"]:checked')?.value) || 'tabs';

/* ========= Small utils ========= */
function setProgress(p) {
  progressFill.style.width = Math.max(0, Math.min(100, p)) + '%';
}
const tick = () => new Promise(r => setTimeout(r, 0));

function makeLog(el) {
  let buffer = [];
  let scheduled = false;
  return (msg) => {
    buffer.push(msg);
    if (!scheduled) {
      scheduled = true;
      setTimeout(() => {
        const prefix = el.textContent ? '\\n' : '';
        el.textContent += prefix + buffer.join('\\n');
        el.scrollTop = el.scrollHeight;
        buffer = [];
        scheduled = false;
      }, 40);
    }
  };
}
const log = makeLog(logEl);

const pad = (n, l = 2) => String(n).padStart(l, '0');
const fmtTime = (t) => {
  const m  = Math.floor(t / 60);
  const s  = Math.floor(t % 60);
  const ms = Math.round((t - Math.floor(t)) * 1000);
  return \`\${pad(m)}:\${pad(s)}.\${pad(ms, 3)}\`;
};

log('🎵 Music → Tabs & Sheet script loaded.');

/* ========= File state & input UX ========= */
let currentFile   = null;
let abortCtrl     = null;
let chordPool     = null;
let yinClient     = null;
let analyzed      = null;   // { title, duration, sr, hop, spans, melody, bpm, key }
let sessionMono   = null;

function setCurrentFile(file) {
  currentFile = file || null;
  fnameEl.textContent = currentFile ? (currentFile.name || '') : 'none';
}

fileEl.addEventListener('change', () => {
  const file = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
  log('File changed: ' + (file ? file.name : 'none'));
  setCurrentFile(file);
});

/* Click on drop area opens file picker (except inner elements) */
dropEl.addEventListener('click', (e) => {
  if (e.target === pickBtn) return; // pickBtn has its own handler
  log('Drop area clicked → open picker');
  fileEl.value = '';
  fileEl.click();
});

/* Browse button */
pickBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  log('Browse button clicked → open picker');
  fileEl.value = '';
  fileEl.click();
});

/* Keyboard on drop area */
dropEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    fileEl.value = '';
    fileEl.click();
  }
});

/* Drag & drop */
dropEl.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropEl.classList.add('drag');
});
dropEl.addEventListener('dragleave', () => {
  dropEl.classList.remove('drag');
});
dropEl.addEventListener('drop', (e) => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
    const file = e.dataTransfer.files[0];
    log('Dropped file: ' + file.name);
    setCurrentFile(file);
  }
});

/* ========= Audio decoding ========= */
async function decodeWithWebAudio(arrayBuf) {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error('Web Audio not supported in this browser.');
  const ctx = new AC();
  const audio = await ctx.decodeAudioData(arrayBuf.slice(0));
  const sr   = audio.sampleRate;
  const len  = audio.length;
  const ch   = audio.numberOfChannels;
  const mono = new Float32Array(len);
  for (let c = 0; c < ch; c++) {
    const data = audio.getChannelData(c);
    for (let i = 0; i < len; i++) mono[i] += data[i] / ch;
  }
  await ctx.close();
  return { sr, mono, duration: audio.duration };
}

function segmentAudio(mono, sr, win = 4096, hop = 2048) {
  const chunks = [];
  let start = 0;
  while (start + win <= mono.length) {
    chunks.push(mono.slice(start, start + win));
    start += hop;
  }
  return { chunks, hop, win, sr };
}

/* ========= Worker helpers ========= */
function makeChordWorkerPool(n) {
  const url = new URL('./workers/batch-worker.js', import.meta.url);
  const workers = Array.from({ length: n }, () => new Worker(url, { type: 'module' }));
  let jobId = 0;

  function runBatch(frames, sr, signal) {
    return new Promise((resolve, reject) => {
      const id = jobId++;
      const w  = workers[id % workers.length];

      const onMsg = (e) => {
        if (!e.data || e.data.id !== id) return;
        w.removeEventListener('message', onMsg);
        resolve(e.data.labels || []);
      };
      w.addEventListener('message', onMsg);

      if (signal) {
        signal.addEventListener('abort', () => {
          w.removeEventListener('message', onMsg);
          reject(new DOMException('Aborted', 'AbortError'));
        }, { once: true });
      }

      w.postMessage({ id, frames, sr }, frames.map(f => f.buffer));
    });
  }

  return {
    runBatch,
    terminate() {
      for (const w of workers) {
        try { w.terminate(); } catch {}
      }
    }
  };
}

function makeYinClient() {
  const url = new URL('./workers/yin-worker.js', import.meta.url);
  const w   = new Worker(url, { type: 'module' });
  let jobId = 0;
  return {
    run(mono, sr, hopSamples, signal) {
      return new Promise((resolve, reject) => {
        const id = jobId++;

        const onMsg = (e) => {
          if (!e.data || e.data.id !== id) return;
          w.removeEventListener('message', onMsg);
          resolve(e.data.notes || []);
        };
        w.addEventListener('message', onMsg);

        if (signal) {
          signal.addEventListener('abort', () => {
            w.removeEventListener('message', onMsg);
            reject(new DOMException('Aborted', 'AbortError'));
          }, { once: true });
        }

        w.postMessage({ id, mono, sr, hopSamples }, [mono.buffer]);
      });
    },
    terminate() { try { w.terminate(); } catch {} }
  };
}

/* ========= Chord span post-processing ========= */
function mergeMicroSpans(spans, minDur = 0.35, forcedSec = 0) {
  if (!spans || !spans.length) return spans;

  const merged = [];
  for (const s of spans) {
    if (!merged.length) {
      merged.push({ ...s });
      continue;
    }
    const last = merged[merged.length - 1];
    if (last.label === s.label) {
      last.end = s.end;
    } else if ((s.end - s.start) <= minDur) {
      last.end = s.end;
    } else {
      merged.push({ ...s });
    }
  }

  if (!forcedSec || forcedSec <= 0) return merged;

  const out = [];
  for (const m of merged) {
    let t = m.start;
    while (t < m.end) {
      const e = Math.min(m.end, t + forcedSec);
      out.push({ start: t, end: e, label: m.label });
      t = e;
    }
  }
  return out;
}

const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function guessKey(spans) {
  if (!spans || !spans.length) return '—';
  const w = {};
  for (const s of spans) {
    const root = s.label.replace(/m$/, '');
    w[root] = (w[root] || 0) + (s.end - s.start);
  }
  const sorted = Object.entries(w).sort((a,b)=>b[1]-a[1]);
  if (!sorted.length) return '—';
  const root = sorted[0][0];
  const idx  = NAMES.indexOf(root);
  if (idx < 0) return root;
  const relMinor = NAMES[(idx + 9 + 12) % 12];
  return \`\${root} Major / \${relMinor} Minor\`;
}

/* ========= Tabs helpers (human-playable chords) ========= */
function padLine(arr, width, fill='-') {
  while (arr.length < width) arr.push(fill);
}
function makeLines(template) {
  return template.split("\\n").map(s => s.split(''));
}
function joinLines(lines) {
  return lines.map(a => a.join('')).join("\\n");
}

// Shapes: [e, B, G, D, A, E]
const GUITAR_SHAPES = {
  'C' : ['0','1','0','2','3','x'],
  'G' : ['3','0','0','0','2','3'],
  'D' : ['2','3','2','0','x','x'],
  'Em': ['0','0','0','2','2','0'],
  'Am': ['0','1','2','2','0','x'],
  'E' : ['0','0','1','2','2','0'],
  'A' : ['0','2','2','2','0','x'],
  'F' : ['1','1','2','3','3','1']
};

function simplifyChordLabel(label) {
  if (!label) return '';
  label = label.trim();
  const m = label.match(/^([A-G][b#]?)(.*)$/);
  if (!m) return label;
  const root = m[1];
  const rest = (m[2] || '').toLowerCase();
  const isMinor = rest.startsWith('m') && !rest.startsWith('maj');
  return root + (isMinor ? 'm' : '');
}
function getGuitarShapeFor(label) {
  const key = simplifyChordLabel(label);
  return GUITAR_SHAPES[key] || GUITAR_SHAPES['C'];
}

function guitarTabsFromChords(spans) {
  let lines = makeLines(
    "e|----------------|----------------|----------------|\n" +
    "B|----------------|----------------|----------------|\n" +
    "G|----------------|----------------|----------------|\n" +
    "D|----------------|----------------|----------------|\n" +
    "A|----------------|----------------|----------------|\n" +
    "E|----------------|----------------|----------------|"
  );
  if (!spans || !spans.length) return joinLines(lines);

  const total = spans[spans.length - 1].end || 1;
  for (const s of spans) {
    const shape = getGuitarShapeFor(s.label);
    const col   = 2 + Math.floor((s.start / total) * 70);
    lines.forEach(line => padLine(line, col + 2, '-'));

    // 0=e ... 5=E
    for (let i = 0; i < 6; i++) {
      const fret = shape[i];
      if (fret === undefined || fret === null) continue;
      const ch  = String(fret);
      if (!ch) continue;
      lines[i][col] = ch;
    }
  }
  return joinLines(lines);
}

function bassTabsFromChords(spans) {
  let lines = makeLines(
    "G|----------------|----------------|----------------|\n" +
    "D|----------------|----------------|----------------|\n" +
    "A|----------------|----------------|----------------|\n" +
    "E|----------------|----------------|----------------|"
  );
  if (!spans || !spans.length) return joinLines(lines);

  const total = spans[spans.length - 1].end || 1;
  let useA = false;
  for (const s of spans) {
    const col   = 2 + Math.floor((s.start / total) * 70);
    const idx   = useA ? 2 : 3; // A or E
    useA = !useA;
    lines.forEach(line => padLine(line, col + 2, '-'));
    lines[idx][col] = '3'; // simple 3rd-fret hit
  }
  return joinLines(lines);
}

function pianoNotesFromChords(spans) {
  if (!spans || !spans.length) return ["RH: —", "LH: —"];
  const names = spans.map(s => simplifyChordLabel(s.label));
  return [
    "RH: " + names.map(n => n.endsWith('m') ? n.replace('m','') + "m triad" : n + " triad").join("  "),
    "LH: " + names.map(n => n.replace('m','') + "2").join("  ")
  ];
}

function drumGrid() {
  const patt = (k) =>
    Array.from({ length: 16 }, (_, i) => k(i) ? 'x' : '-').join('');
  return [
    "Kick | "  + patt(i => i % 4 === 0),
    "Snare| " + patt(i => i % 8 === 4),
    "HH   | " + patt(i => i % 2 === 0)
  ];
}

/* ========= Export helpers ========= */
function chordProFromSpansAndLyrics(spans, lyricsText, totalSec) {
  if (!spans || !spans.length || !lyricsText) return null;
  const words = lyricsText.trim().split(/\\s+/);
  if (!words.length) return null;
  const per = totalSec / Math.max(words.length, 1);

  let res = '';
  let idx = 0;
  for (let w = 0; w < words.length; w++) {
    const t = w * per;
    while (idx + 1 < spans.length && spans[idx + 1].start <= t) idx++;
    const addChord = (w === 0) ||
                     (spans[idx].start <= t && (idx === 0 ? true : spans[idx].start > (w - 1) * per));
    res += (addChord ? '[' + spans[idx].label + ']' : '') + words[w] + (w % 12 === 11 ? "\\n" : " ");
  }
  return res.trim();
}

function toMarkdown(title, spans, g, b, p, d, chordPro) {
  const L = [];
  L.push('# ' + (title || 'Song') + ' — Tabs & Chords', '');
  if (chordPro) {
    L.push('## Lyrics + Chords', '```chordpro', chordPro, '```', '');
  }
  if (g) { L.push('## Guitar Tabs', '```', g, '```', ''); }
  if (b) { L.push('## Bass Tabs', '```', b, '```', ''); }
  if (p && p.length) {
    L.push('## Piano Hints');
    for (const line of p) L.push('- ' + line);
    L.push('');
  }
  if (d && d.length) {
    L.push('## Drum Grid');
    for (const line of d) L.push('`' + line + '`');
    L.push('');
  }
  L.push('## Chord Timeline','');
  for (const s of spans) {
    L.push('- ' + fmtTime(s.start) + '–' + fmtTime(s.end) + ': **' + s.label + '**');
  }
  L.push('');
  return L.join('\\n');
}

function toPlainTabs(g, b, p, d) {
  const L = [];
  if (g) { L.push('GUITAR', g, ''); }
  if (b) { L.push('BASS', b, ''); }
  if (p && p.length) {
    L.push('PIANO');
    L.push(...p);
    L.push('');
  }
  if (d && d.length) {
    L.push('DRUMS');
    L.push(...d);
    L.push('');
  }
  return L.join('\\n');
}

function toJSONFile(title, spans, meta) {
  return JSON.stringify({ title, chords: spans, meta }, null, 2);
}

function toWebVTT(spans) {
  const L = ['WEBVTT', ''];
  function fmtT(t) {
    const h  = Math.floor(t / 3600);
    const m  = Math.floor((t % 3600) / 60);
    const s  = Math.floor(t % 60);
    const ms = Math.round((t - Math.floor(t)) * 1000);
    const pad2 = (n) => String(n).padStart(2, '0');
    const pad3 = (n) => String(n).padStart(3, '0');
    return \`\${pad2(h)}:\${pad2(m)}:\${pad2(s)}.\${pad3(ms)}\`;
  }
  for (const s of spans) {
    L.push(\`\${fmtT(s.start)} --> \${fmtT(s.end)}\`, s.label, '');
  }
  return L.join('\\n');
}

function downloadText(name, text, type='text/plain') {
  const blob = new Blob([text], { type });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1000);
}

/* ========= VexFlow sheet rendering ========= */
let VF = null;
async function loadVexFlowOnce() {
  if (VF) return VF;
  const mod = await import('https://unpkg.com/vexflow@4.2.4/build/esm/vexflow.js');
  VF = mod.Flow || mod; // depending on build
  return VF;
}

function pitchToVexKey(midi) {
  const names = ['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'];
  const step  = names[midi % 12];
  const oct   = Math.floor(midi / 12) - 1;
  return \`\${step}/\${oct}\`;
}

function quantizeToNearestDur(beats) {
  const D = [
    { dur:'w',  beats:4 },
    { dur:'h',  beats:2 },
    { dur:'q',  beats:1 },
    { dur:'8',  beats:0.5 },
    { dur:'16', beats:0.25 }
  ];
  let best = D[0], bestDiff = Infinity;
  for (const d of D) {
    const diff = Math.abs(d.beats - beats);
    if (diff < bestDiff) { bestDiff = diff; best = d; }
  }
  return best;
}

function syllabify(text) {
  if (!text) return [];
  const words = text.trim().split(/\\s+/);
  const out   = [];
  for (const w of words) {
    const parts = w.split(/(?<=[aeiouyAEIOUY])/);
    for (const p of parts) if (p) out.push(p);
  }
  return out;
}

async function renderSheet({ title, bpm = 100, melody = [], chords = [], lyricsText = '' }) {
  const Flow = await loadVexFlowOnce();
  const VFLocal = Flow;

  const canvas = scoreCanvas;
  const ctx    = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const renderer = new VFLocal.Renderer(canvas, VFLocal.Renderer.Backends.CANVAS);
  renderer.resize(canvas.width, canvas.height);
  const context = renderer.getContext();
  context.setFont('Arial', 12, '').setFillStyle('#e5e7eb');

  const stave = new VFLocal.Stave(30, 40, canvas.width - 60);
  stave.addClef('treble').addTimeSignature('4/4');
  stave.setContext(context).draw();

  const notes = [];
  const beatsPerSec = bpm / 60;

  if (melody && melody.length) {
    for (const n of melody) {
      const durBeats = (n.end - n.start) * beatsPerSec;
      const q        = quantizeToNearestDur(durBeats);
      const key      = pitchToVexKey(n.midi);
      notes.push(new VFLocal.StaveNote({ keys: [key], duration: q.dur }));
    }
  } else {
    notes.push(new VFLocal.StaveNote({ keys: ['c/4'], duration: 'w' }));
  }

  const sylls = syllabify(lyricsText);
  const max   = Math.min(sylls.length, notes.length);
  for (let i = 0; i < max; i++) {
    const ann = new VFLocal.Annotation(sylls[i])
      .setFont('Arial', 11)
      .setVerticalJustification(VFLocal.Annotation.VerticalJustify.BOTTOM);
    notes[i].addAnnotation(0, ann);
  }

  const voice = new VFLocal.Voice({ num_beats: 4, beat_value: 4 });
  voice.addTickables(notes);
  new VFLocal.Formatter().joinVoices([voice]).format([voice], canvas.width - 80);
  voice.draw(context, stave);

  // Draw chord labels above staff
  context.save();
  context.setFont('12px Arial');
  const secToBeats = (sec) => (sec * bpm) / 60;
  for (const s of chords) {
    const beat  = secToBeats(s.start);
    const rel   = (beat % 4) / 4;
    const x     = 30 + rel * (canvas.width - 60);
    const y     = stave.getYForTopText() - 6;
    context.fillText(s.label, x, y);
  }
  context.restore();
}

/* ========= Analysis ========= */
function validateFile(file, maxMB = 200) {
  if (!file) throw new Error('No file selected.');
  const mb = file.size / (1024 * 1024);
  if (mb > maxMB) throw new Error(\`File too large (\${mb.toFixed(1)} MB). Limit is \${maxMB} MB.\`);
}

analyzeBtn.addEventListener('click', analyzeOnce);
abortBtn.addEventListener('click', () => abortCtrl?.abort());

async function analyzeOnce() {
  try {
    const file = currentFile;
    validateFile(file);

    abortCtrl = new AbortController();
    analyzeBtn.disabled = true;
    abortBtn.disabled   = false;
    renderBtn.disabled  = true;

    scoreWrap.style.display = 'none';
    previewEl.textContent   = '';
    logEl.textContent       = '';
    setProgress(3);
    statusEl.textContent = 'Decoding audio…';

    const arrayBuf = await file.arrayBuffer();
    const dec      = await decodeWithWebAudio(arrayBuf);
    sessionMono    = dec.mono;
    const sr       = dec.sr;
    const duration = dec.duration;

    if (duration > 600) throw new Error(\`Audio too long (\${duration.toFixed(0)} s). Limit is 600 s.\`);

    setProgress(15);
    statusEl.textContent = 'Framing audio & running chord model…';

    const { chunks, hop } = segmentAudio(sessionMono, sr, 4096, 2048);
    if (!chunks.length) throw new Error('No audio frames.');

    const nWorkers = Math.max(2, Math.min(4, navigator.hardwareConcurrency || 4));
    chordPool = makeChordWorkerPool(nWorkers);

    const batchSize = Math.ceil(chunks.length / nWorkers);
    const batches   = [];
    for (let i = 0; i < chunks.length; i += batchSize) {
      batches.push(chunks.slice(i, i + batchSize));
    }

    const labels = [];
    let processed = 0;
    for (const b of batches) {
      const partial = await chordPool.runBatch(b, sr, abortCtrl.signal);
      labels.push(...partial);
      processed += b.length;
      setProgress(15 + 45 * (processed / chunks.length));
      await tick();
    }
    chordPool.terminate();
    chordPool = null;

    const hopSec = hop / sr;
    const spans  = [];
    let cur = null, startIdx = 0;
    const toTime = (i) => i * hopSec;

    for (let i = 0; i < labels.length; i++) {
      if (cur === null) {
        cur = labels[i];
        startIdx = i;
      } else if (labels[i] !== cur) {
        spans.push({ start: toTime(startIdx), end: toTime(i), label: cur });
        cur = labels[i];
        startIdx = i;
      }
    }
    if (cur !== null) {
      spans.push({ start: toTime(startIdx), end: toTime(labels.length), label: cur });
    }

    const forced = Number(splitSel.value || 0);
    let merged   = mergeMicroSpans(spans, 0.35, forced);
    if ((!merged || merged.length <= 1) && forced === 0) {
      merged = mergeMicroSpans(spans, 0.35, 4);
    }

    log('Chord spans: ' + merged.length);

    const title = (file.name || 'Song').replace(/\.[^.]+$/, '');
    const bpm   = 100;
    const key   = guessKey(merged);

    let melody = [];
    if (vocalsChk.checked) {
      yinClient = yinClient || makeYinClient();
      statusEl.textContent = 'Estimating vocal melody…';
      melody = await yinClient.run(sessionMono, sr, 2048, abortCtrl.signal);
      log('Vocal notes: ' + melody.length);
    }

    analyzed = { title, duration, sr, hop: 2048, spans: merged, melody, bpm, key };
    statusEl.textContent = 'Analysis complete.';
    setProgress(80);
    renderBtn.disabled = false;

    log('Preview of first few chords:');
    log(merged.slice(0, 8).map(s => \`[\${fmtTime(s.start)}–\${fmtTime(s.end)}] \${s.label}\`).join('\\n'));

  } catch (err) {
    if (err.name === 'AbortError') {
      log('⚠️ Analysis aborted by user.');
      statusEl.textContent = 'Canceled.';
    } else {
      log('❌ ' + err.message);
      statusEl.textContent = 'Failed.';
    }
  } finally {
    analyzeBtn.disabled = false;
    abortBtn.disabled   = true;
    abortCtrl           = null;
    setProgress(100);
  }
}

/* ========= Render ========= */
renderBtn.addEventListener('click', () => {
  if (!analyzed) {
    alert('No analysis yet. Click Analyze first.');
    return;
  }
  renderFromAnalysis();
});

[...modeRadios].forEach(r => r.addEventListener('change', () => { if (analyzed) renderFromAnalysis(); }));
vocalsChk.addEventListener('change', () => { /* only affects next analysis / sheet */ });

function renderFromAnalysis() {
  const mode = getMode();
  if (!analyzed || !analyzed.spans || !analyzed.spans.length) {
    previewEl.textContent = '(no chord data)';
    return;
  }

  const spans   = analyzed.spans;
  const duration = analyzed.duration;

  if (mode === 'sheet') {
    scoreWrap.style.display = 'block';
    previewEl.textContent   = '';
    const lyricsText = (lyricsEl.value || '').trim();
    renderSheet({
      title: analyzed.title,
      bpm: analyzed.bpm || 100,
      melody: vocalsChk.checked ? (analyzed.melody || []) : [],
      chords: spans,
      lyricsText
    }).catch(err => {
      log('⚠️ Sheet render failed: ' + err.message);
      scoreWrap.style.display = 'none';
    });
    return;
  }

  // Tabs mode
  scoreWrap.style.display = 'none';

  const g = guitarChk.checked ? guitarTabsFromChords(spans) : null;
  const b = bassChk.checked   ? bassTabsFromChords(spans) : null;
  const p = pianoChk.checked  ? pianoNotesFromChords(spans) : null;
  const d = drumsChk.checked  ? drumGrid() : null;
  const chordPro = chordProFromSpansAndLyrics(spans, (lyricsEl.value || '').trim(), duration);

  const anyFmt = fmtMd.checked || fmtTxt.checked || fmtJSON.checked || fmtVTT.checked;
  if (!anyFmt) {
    log('ℹ️ No export format selected. Tick Markdown/Text/JSON/VTT and click Render.');
  }

  if (fmtMd.checked) {
    const md = toMarkdown(analyzed.title, spans, g, b, p, d, chordPro);
    downloadText(\`\${analyzed.title || 'song'}-tabs.md\`, md, 'text/markdown');
  }
  if (fmtTxt.checked) {
    const txt = toPlainTabs(g, b, p, d);
    downloadText(\`\${analyzed.title || 'song'}-tabs.txt\`, txt, 'text/plain');
  }
  if (fmtJSON.checked) {
    const meta = { key: analyzed.key, bpm: analyzed.bpm, duration };
    const json = toJSONFile(analyzed.title, spans, meta);
    downloadText(\`\${analyzed.title || 'song'}-chords.json\`, json, 'application/json');
  }
  if (fmtVTT.checked) {
    const vtt = toWebVTT(spans);
    downloadText(\`\${analyzed.title || 'song'}-chords.vtt\`, vtt, 'text/vtt');
  }

  // Show a live preview (Markdown) in the UI
  const mdPreview = toMarkdown(analyzed.title, spans, g, b, p, d, chordPro);
  previewEl.textContent = mdPreview;
}

/* ========= Init ========= */
setProgress(0);
statusEl.textContent = 'Idle.';
</script>
