<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music → Tabs & Chords (Local, Batched)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Convert a song into tabs, chords and timelines in your browser — 100% local.">
<style>
  :root{--bg:#0f1117;--panel:#121826;--ink:#e5f2ff;--muted:#9aa4b2;--line:#263044;--cyan:#67e8f9;--vio:#a78bfa}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial}
  header{padding:22px 16px;text-align:center;border-bottom:1px solid #1f2430}
  h1{margin:0;font-size:28px;background:linear-gradient(90deg,var(--cyan),var(--vio));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 64px}
  .card{background:linear-gradient(180deg,#121826,#0b1220);border:1px solid var(--line);border-radius:16px;box-shadow:0 0 24px rgba(103,232,249,.14)}
  .pad{padding:18px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:900px){.row{grid-template-columns:1fr}}
  label.title{display:block;font-size:13px;color:#cfe6ff;margin:8px 0 6px}
  .drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer}
  .drop.drag{border-color:var(--cyan);background:rgba(103,232,249,.06)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 12px;border-radius:999px}
  textarea{width:100%;min-height:120px;resize:vertical;border-radius:12px;padding:12px 14px;background:#0a1424;border:1px solid var(--line);color:var(--ink)}
  .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .btn{border:0;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:700;background:linear-gradient(90deg,var(--cyan),var(--vio));color:#07101a}
  .btn.sec{background:#0a1424;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .bar{height:8px;background:#0a1424;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:10px}
  .bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--vio));transition:width .25s}
  pre{margin:10px 0 0;padding:12px;border:1px dashed var(--line);border-radius:12px;background:#07101a;color:#cfe6ff;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:220px;overflow:auto;white-space:pre-wrap}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Music → Tabs & Chords (Local, Batched)</h1>
  <p class="muted" style="margin:.3rem 0 0">Runs entirely in your browser. No uploads. Smooth progress + Abort.</p>
</header>

<div class="wrap">
  <div class="card"><div class="pad">
    <div class="row">
      <div>
        <label class="title">Audio/Video file</label>
        <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose file">
          <input id="file" type="file" accept="audio/*,video/*" hidden>
          Drag & drop here, or <u>browse</u>
          <div id="fname" class="muted" style="margin-top:6px"></div>
        </div>

        <label class="title" style="margin-top:14px">Instruments</label>
        <div class="chips" id="chips">
          <label class="chip"><input type="checkbox" value="guitar" checked> Guitar</label>
          <label class="chip"><input type="checkbox" value="bass"> Bass</label>
          <label class="chip"><input type="checkbox" value="piano"> Piano</label>
          <label class="chip"><input type="checkbox" value="drums"> Drums</label>
        </div>

        <label class="title" style="margin-top:14px">Export formats</label>
        <div class="chips">
          <label class="chip"><input type="checkbox" id="fmt-md" checked> Markdown (.md)</label>
          <label class="chip"><input type="checkbox" id="fmt-txt"> Text Tabs (.txt)</label>
          <label class="chip"><input type="checkbox" id="fmt-json"> JSON (.json)</label>
          <label class="chip"><input type="checkbox" id="fmt-vtt"> WebVTT (.vtt)</label>
        </div>
      </div>

      <div>
        <label class="title">Lyrics (optional)</label>
        <textarea id="lyrics" placeholder="Paste lyrics here…"></textarea>
      </div>
    </div>

    <div class="actions">
      <button id="convert" class="btn">Convert (batched)</button>
      <button id="abort" class="btn sec" disabled>Abort</button>
      <span id="status" class="muted"></span>
    </div>
    <div class="bar"><i id="progress-fill"></i></div>
    <pre id="log"></pre>
  </div></div>
</div>

<script type="module">
/* ===== UI refs ===== */
const drop = document.querySelector('#drop');
const fileEl = document.querySelector('#file');
const fname = document.querySelector('#fname');
const chips = document.querySelector('#chips');
const lyrics = document.querySelector('#lyrics');
const goBtn = document.querySelector('#convert');
const abortBtn = document.querySelector('#abort');
const statusEl = document.querySelector('#status');
const logEl = document.querySelector('#log');
const fill = document.querySelector('#progress-fill');

const fmtMD   = document.querySelector('#fmt-md');
const fmtTXT  = document.querySelector('#fmt-txt');
const fmtJSON = document.querySelector('#fmt-json');
const fmtVTT  = document.querySelector('#fmt-vtt');

/* ===== Small utils ===== */
function setProgress(p){ fill.style.width = Math.max(0,Math.min(100,p)) + '%'; }
function tick(){ return new Promise(r=>setTimeout(r,0)); }
function makeLog(el){ let buf=[], s=false; return (msg)=>{ buf.push(msg); if(!s){ s=true; setTimeout(()=>{ el.textContent+=buf.join('\n')+'\n'; el.scrollTop=el.scrollHeight; buf=[]; s=false; },50);} }; }
const log = makeLog(logEl);
const pad = (n,l=2)=> String(n).padStart(l,'0');
const fmtTime = (t)=>{ const m=Math.floor(t/60), s=Math.floor(t%60), ms=Math.round((t-Math.floor(t))*1000); return `${pad(m)}:${pad(s)}.${pad(ms,3)}`; };

/* ===== File input UX ===== */
drop.onclick = ()=> fileEl.click();
drop.onkeydown = (e)=>{ if(e.key==='Enter'||e.key===' ') fileEl.click(); };
fileEl.onchange = ()=> fname.textContent = fileEl.files[0]?.name ?? '';
drop.ondragover = (e)=>{ e.preventDefault(); drop.classList.add('drag'); };
drop.ondragleave = ()=> drop.classList.remove('drag');
drop.ondrop = (e)=>{ e.preventDefault(); drop.classList.remove('drag'); fileEl.files = e.dataTransfer.files; fname.textContent=fileEl.files[0]?.name ?? ''; };

/* ===== Audio helpers ===== */
async function decodeWithWebAudio(arrayBuf){
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const audio = await ac.decodeAudioData(arrayBuf.slice(0));
  await ac.close();
  return audio;
}
async function decodeViaFFmpeg(file){
  const { createFFmpeg, fetchFile } = await import('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/ffmpeg.min.js');
  const ffmpeg = createFFmpeg({ log:false });
  await ffmpeg.load();
  ffmpeg.FS('writeFile','in', await fetchFile(file));
  await ffmpeg.run('-i','in','-vn','-ac','1','-ar','22050','-f','wav','out.wav');
  const wav = ffmpeg.FS('readFile','out.wav');
  ffmpeg.exit();
  return await decodeWithWebAudio(wav.buffer);
}
function mixToMono(buf){
  const len=buf.length, ch=buf.numberOfChannels; const out=new Float32Array(len);
  for(let c=0;c<ch;c++){ const d=buf.getChannelData(c); for(let i=0;i<len;i++) out[i]+=d[i]/ch; }
  return out;
}
function validateFile(file, maxMB=200){
  if(!file) throw new Error('No file selected.');
  const mb = file.size/(1024*1024);
  if(mb>maxMB) throw new Error(`File too large (${mb.toFixed(1)} MB). Limit ${maxMB} MB.`);
}

/* ===== Batching & worker pool ===== */
function frameAudioInChunks(mono, sr, win=4096, hop=2048, framesPerChunk=192){
  const chunks=[]; let frames=[];
  for(let i=0;i+win<=mono.length;i+=hop){
    frames.push(mono.subarray(i,i+win).slice()); // transferable
    if(frames.length===framesPerChunk){ chunks.push(frames); frames=[]; }
  }
  if(frames.length) chunks.push(frames);
  return { chunks, hop, sr };
}
function makeWorkerPool(n){
  const url = new URL('./workers/batch-worker.js', import.meta.url);
  const ws = Array.from({length:n}, ()=> new Worker(url, {type:'module'}));
  let nextId=0;
  function runBatch(frames, sr, signal){
    return new Promise((resolve,reject)=>{
      const id = nextId++;
      const w = ws[id % ws.length];
      const onMsg = (e)=>{ if(e.data?.id!==id) return; w.removeEventListener('message', onMsg); resolve(e.data.labels); };
      w.addEventListener('message', onMsg);
      if(signal){ signal.addEventListener('abort', ()=>{ w.removeEventListener('message', onMsg); reject(new DOMException('Aborted','AbortError')); }, {once:true}); }
      w.postMessage({ id, frames, sr }, frames.map(f=>f.buffer));
    });
  }
  function terminate(){ ws.forEach(w=>w.terminate()); }
  return { runBatch, size:n, terminate };
}

/* ===== Safe tab helpers (no out-of-bounds) ===== */
function padLine(arr, width, fill='-'){ while(arr.length < width) arr.push(fill); }
function makeLines(template){ return template.split("\n").map(s => s.split("")); }
function joinLines(lines){ return lines.map(a => a.join("")).join("\n"); }

function guitarTabsFromChords(spans){
  let lines = makeLines(
    "e|----------------|----------------|\n" +
    "B|----------------|----------------|\n" +
    "G|----------------|----------------|\n" +
    "D|----------------|----------------|\n" +
    "A|----------------|----------------|\n" +
    "E|----------------|----------------|"
  );
  if (!spans || !spans.length) return joinLines(lines);

  const end = spans[spans.length - 1].end || 1;
  for (const s of spans){
    const col = 2 + Math.floor((s.start / end) * 60);      // 60 cols canvas
    const digits = String((s.label.charCodeAt(0) % 12));   // placeholder
    lines.forEach(line => padLine(line, col + digits.length + 1, '-'));
    const lineIdx = 5; // low E
    for (let i = 0; i < digits.length; i++){
      lines[lineIdx][col + i] = digits[i];
    }
  }
  return joinLines(lines);
}

function bassTabsFromChords(spans){
  let lines = makeLines(
    "G|----------------|----------------|\n" +
    "D|----------------|----------------|\n" +
    "A|----------------|----------------|\n" +
    "E|----------------|----------------|"
  );
  if (!spans || !spans.length) return joinLines(lines);

  const end = spans[spans.length - 1].end || 1;
  let useA = false;
  for (const s of spans){
    const col = 2 + Math.floor((s.start / end) * 60);
    const lineIdx = useA ? 2 : 3; useA = !useA; // A or E
    lines.forEach(line => padLine(line, col + 2, '-'));
    lines[lineIdx][col] = '3'; // placeholder fret
  }
  return joinLines(lines);
}

function pianoNotesFromChords(spans){
  if (!spans || !spans.length) return ["RH: —", "LH: —"];
  const names = spans.map(s=>s.label);
  return [
    "RH: " + names.map(n=> n.endsWith("m") ? (n.replace('m','')+'m triad') : (n+' triad')).join("  "),
    "LH: " + names.map(n=> n.replace('m','')+"2").join("  ")
  ];
}
function drumGrid(duration, bpm){
  const patt=(k)=>Array.from({length:16},(_,i)=>k(i)?'x':'-').join('');
  return ["Kick | "+patt(i=>i%4===0), "Snare| "+patt(i=>i%8===4), "HH   | "+patt(i=>i%2===0)];
}

/* ===== Chord text helpers ===== */
function buildChordProText(spans, lyricsText, duration){
  if(!spans || !spans.length){
    return lyricsText?.trim() ? lyricsText.trim() : "[Intro] —";
  }
  if(!lyricsText) return "[Intro] " + spans.slice(0,4).map(s=>s.label).join("  ");
  const words = lyricsText.trim().split(/\s+/); if(words.length===0) return lyricsText;
  const per = (duration||words.length)/Math.max(1,words.length);
  let res="", idx=0;
  for(let w=0;w<words.length;w++){
    const t = w*per;
    while(idx+1<spans.length && spans[idx+1].start<=t) idx++;
    const add = (w===0) || (spans[idx].start<=t && (idx===0?true:spans[idx].start>(w-1)*per));
    res += (add?`[${spans[idx].label}]`:"")+words[w]+((w%12===11)?"\n":" ");
  }
  return res.trim();
}
function guessKey(spans){
  if(!spans || !spans.length) return "—";
  const w={}; spans.forEach(s=>{const r=s.label.replace('m',''); w[r]=(w[r]||0)+(s.end-s.start);});
  const best=Object.entries(w).sort((a,b)=>b[1]-a[1])[0]; return best? best[0]+' Major/Minor' : '—';
}

/* ===== Export helpers ===== */
function toMarkdown(title, chords, g=null, b=null, p=null, d=null, chordPro=null){
  const L=[]; L.push(`# ${title} — Tabs & Chords`,'');
  if(chordPro){ L.push('## Lyrics + Chords','```chordpro',chordPro,'```',''); }
  if(g){ L.push('## Guitar Tabs','```',g,'```',''); }
  if(b){ L.push('## Bass Tabs','```',b,'```',''); }
  if(p?.length){ L.push('## Piano (notes)',...p.map(x=>'- '+x),''); }
  if(d?.length){ L.push('## Drums (grid)',...d.map(x=>'`'+x+'`'),''); }
  L.push('## Chord Timeline','', ...(chords||[]).map(c=>`- ${fmtTime(c.start)}–${fmtTime(c.end)}: **${c.label}**`),'');
  return L.join('\n');
}
function toPlainTabs(g=null,b=null,p=null,d=null){ const o=[]; if(g){o.push('GUITAR',g,'');} if(b){o.push('BASS',b,'');} if(p?.length){o.push('PIANO',...p,'');} if(d?.length){o.push('DRUMS',...d,'');} return o.join('\n'); }
function toJSONFile(title, chords, meta={}){ return JSON.stringify({title,chords,meta},null,2); }
function toWebVTT(chords){
  const L=['WEBVTT','']; const to=(t)=>{const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60),ms=Math.round((t-Math.floor(t))*1000); const z=(n,l=2)=>String(n).padStart(l,'0'); return `${z(h)}:${z(m)}:${z(s)}.${z(ms,3)}`;}
  (chords||[]).forEach((c,i)=>{L.push(String(i+1)); L.push(`${to(c.start)} --> ${to(c.end)}`); L.push(c.label,'');});
  return L.join('\n');
}
function downloadText(filename, text){ const blob=new Blob([text],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href); }

/* ===== Main pipeline ===== */
let controller=null, pool=null;

goBtn.addEventListener('click', runBatched);
async function runBatched(){
  const file = fileEl.files?.[0];
  try{
    validateFile(file);
  }catch(e){ alert(e.message); return; }

  controller = new AbortController();
  abortBtn.disabled = true; // enable after decode to avoid accidental spam

  try{
    logEl.textContent=''; setProgress(3); statusEl.textContent='Decoding…'; goBtn.disabled = true;

    // Decode (native first)
    let audio;
    try{
      audio = await decodeWithWebAudio(await file.arrayBuffer());
    }catch{
      log('Native decode failed → using ffmpeg.wasm…');
      audio = await decodeViaFFmpeg(file);
    }
    if(audio.duration>600) throw new Error(`Audio too long (${audio.duration.toFixed(0)}s). Limit 600s.`);

    abortBtn.disabled = false;
    abortBtn.onclick = ()=> controller?.abort();

    // Prep
    statusEl.textContent='Framing…'; setProgress(10);
    const mono = mixToMono(audio);
    const { chunks, hop, sr } = frameAudioInChunks(mono, audio.sampleRate, 4096, 2048, 192);
    const total = chunks.length; log(`Framed into ${total} batches (${chunks[0]?.length||0} frames each).`);

    // Pool
    const cores = navigator.hardwareConcurrency || 4;
    pool = pool || makeWorkerPool(Math.min(cores, 4));
    statusEl.textContent='Analyzing (parallel)…';

    const labels = []; let done=0;
    for(let i=0;i<chunks.length;i+=pool.size){
      if(controller.signal.aborted) throw new DOMException('Aborted','AbortError');
      const wave = chunks.slice(i, i+pool.size);
      const res = await Promise.all(wave.map(b => pool.runBatch(b, sr, controller.signal)));
      res.forEach(arr => labels.push(...arr));
      done += wave.length;
      setProgress(10 + Math.floor(75 * done/total));
      statusEl.textContent = `Analyzing… ${done}/${total}`;
      log(`✔️ Batch ${done}/${total} complete`);
      await tick(); // keep UI responsive
    }

    // Merge to spans
    const toTime = (idx)=> idx*hop/sr; const spans=[];
    if(labels.length){ let cur=labels[0], s=0;
      for(let i=1;i<labels.length;i++){ if(labels[i]!==cur){ spans.push({start:toTime(s), end:toTime(i), label:cur}); cur=labels[i]; s=i; } }
      spans.push({start:toTime(s), end:toTime(labels.length), label:cur});
    }
    log(`Built ${spans.length} spans from ${labels.length} frame labels.`);

    if (!spans.length) {
      setProgress(100);
      statusEl.textContent = 'No chord changes detected (very short/quiet audio).';
      log('No spans generated — exporting empty templates.');
    }

    // Build parts
    const title = (file.name||'Song').replace(/\.[^.]+$/,'');
    const key   = guessKey(spans);
    const bpm   = null; // add an estimator later if needed

    const selected = [...(document.querySelectorAll('#chips input:checked')||[])].map(i=>i.value);
    const g = selected.includes('guitar') ? guitarTabsFromChords(spans) : null;
    const b = selected.includes('bass')   ? bassTabsFromChords(spans)   : null;
    const p = selected.includes('piano')  ? pianoNotesFromChords(spans) : null;
    const d = selected.includes('drums')  ? drumGrid(audio.duration, bpm) : null;
    const chordPro = buildChordProText(spans, (lyrics.value||'').trim(), audio.duration);

    // Export (fast)
    statusEl.textContent='Exporting…'; setProgress(92);
    if(fmtMD.checked)   downloadText(`${title}_tabs.md`,  toMarkdown(title, spans, g, b, p, d, chordPro));
    if(fmtTXT.checked)  downloadText(`${title}_tabs.txt`, toPlainTabs(g, b, p, d));
    if(fmtJSON.checked) downloadText(`${title}_chords.json`, toJSONFile(title, spans, { key, bpm }));
    if(fmtVTT.checked)  downloadText(`${title}_chords.vtt`, toWebVTT(spans));

    setProgress(100); statusEl.textContent='Done.';
    const preview = spans.slice(0,8).map(s=>`[${fmtTime(s.start)}–${fmtTime(s.end)}] ${s.label}`).join('\n');
    log('Preview:\n'+preview);
  }catch(err){
    if(err.name==='AbortError'){ statusEl.textContent='Canceled.'; log('⚠️ Aborted by user'); }
    else { statusEl.textContent='Failed.'; log('❌ '+err.message); }
  }finally{
    goBtn.disabled=false; abortBtn.disabled=true; controller=null;
  }
}

/* Dev: long-task console telemetry */
(function(){ if(!('PerformanceObserver' in window)) return; try{const o=new PerformanceObserver(l=>{for(const e of l.getEntries()) if(e.duration>=120) console.log('[LongTask]',Math.round(e.duration)+'ms');}); o.observe({type:'longtask', buffered:true});}catch(_){} })();
</script>
</body>
</html>
