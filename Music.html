<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Music → Tabs & Sheet (Local)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Turn an audio file into simple guitar tabs, bass hints, and a lead sheet – all locally in your browser." />

  <style>
    :root{
      --bg:#020617;
      --panel:#0b1120;
      --ink:#e5f2ff;
      --muted:#9ca3af;
      --line:#1f2937;
      --cyan:#67e8f9;
      --vio:#a855f7;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:radial-gradient(circle at top,#020617 0,#020617 35%,#020617 100%);
      color:var(--ink);
      font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    header{
      padding:20px 16px;
      text-align:center;
      border-bottom:1px solid #111827;
    }
    header h1{
      margin:0;
      font-size:24px;
      background:linear-gradient(90deg,var(--cyan),var(--vio));
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    header p{
      margin:6px 0 0;
      color:var(--muted);
      font-size:13px;
    }
    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:18px 16px 48px;
    }
    .card{
      background:var(--panel);
      border-radius:18px;
      border:1px solid #111827;
      box-shadow:0 0 30px rgba(15,23,42,.8);
      margin-bottom:16px;
    }
    .pad{padding:18px}
    .row{
      display:grid;
      grid-template-columns:1.1fr 1fr;
      gap:16px;
    }
    @media(max-width:900px){
      .row{grid-template-columns:1fr}
    }

    label.title{
      display:block;
      font-size:13px;
      color:#cbd5f5;
      margin:4px 0 6px;
    }

    .drop{
      border:2px dashed #1f2937;
      border-radius:14px;
      padding:18px;
      text-align:center;
      cursor:pointer;
      background:radial-gradient(circle at top,rgba(103,232,249,0.12) 0,transparent 55%);
      transition:border-color .15s ease,background-color .15s ease;
    }
    .drop.drag{
      border-color:var(--cyan);
      background-color:rgba(15,23,42,.9);
    }
    #fname{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:6px;
    }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid #1f2937;
      background:#020617;
      font-size:11px;
      color:var(--muted);
    }

    .btn{
      appearance:none;
      border:none;
      border-radius:10px;
      padding:8px 14px;
      font-size:13px;
      font-weight:600;
      cursor:pointer;
      background:linear-gradient(90deg,var(--cyan),var(--vio));
      color:#020617;
    }
    .btn.sec{
      background:transparent;
      color:var(--ink);
      border:1px solid #1f2937;
    }
    .btn[disabled]{
      opacity:.5;
      cursor:default;
    }

    .progress{
      width:100%;
      height:7px;
      border-radius:999px;
      border:1px solid #111827;
      overflow:hidden;
      background:#020617;
      margin-top:8px;
    }
    .progress-fill{
      height:100%;
      width:0;
      background:linear-gradient(90deg,var(--cyan),var(--vio));
      transition:width .2s ease-out;
    }

    textarea{
      width:100%;
      min-height:110px;
      resize:vertical;
      border-radius:12px;
      border:1px solid #1f2937;
      padding:8px 10px;
      background:#020617;
      color:var(--ink);
      font:13px/1.4 system-ui,sans-serif;
    }

    .muted{
      color:var(--muted);
      font-size:12px;
    }

    pre.preview{
      margin:0;
      margin-top:8px;
      border-radius:12px;
      border:1px dashed #1f2937;
      padding:10px;
      background:#020617;
      font-family:ui-monospace,Menlo,Consolas,monospace;
      font-size:12px;
      white-space:pre;
      overflow:auto;
      max-height:260px;
    }

    #log{
      margin:0;
      border-radius:12px;
      border:1px solid #111827;
      padding:10px;
      background:#020617;
      font-family:ui-monospace,Menlo,Consolas,monospace;
      font-size:11px;
      white-space:pre-wrap;
      max-height:260px;
      overflow:auto;
    }

    canvas{
      display:block;
      max-width:100%;
      border-radius:10px;
      border:1px solid #111827;
      background:#020617;
      margin-bottom:8px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }
  </style>
</head>
<body>
<header>
  <h1>Music → Tabs & Sheet</h1>
  <p>Drop an audio file once, get human-playable guitar tabs and a simple lead sheet. Local only.</p>
</header>

<div class="wrap">
  <!-- INPUT + OPTIONS -->
  <div class="card">
    <div class="pad">
      <div class="row">
        <!-- LEFT: file + buttons -->
        <div>
          <label class="title">Audio file</label>
          <input id="file" type="file" accept="audio/*" hidden />
          <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose an audio file">
            <div>Drag &amp; drop audio here</div>
            <div class="muted" style="margin-top:4px">or</div>
            <button id="pickBtn" type="button" class="btn sec" style="margin-top:6px;">Browse…</button>
            <div id="fname">No file selected.</div>
          </div>

          <div class="actions">
            <button id="analyzeBtn" class="btn">Analyze</button>
            <button id="abortBtn"   class="btn sec" disabled>Abort</button>
          </div>

          <div class="progress">
            <div id="progressFill" class="progress-fill"></div>
          </div>
          <div id="status" class="muted" style="margin-top:4px">Idle.</div>
        </div>

        <!-- RIGHT: modes + exports -->
        <div>
          <label class="title">Mode</label>
          <div class="chips">
            <label class="chip">
              <input type="radio" name="mode" value="tabs" checked /> Tabs
            </label>
            <label class="chip">
              <input type="radio" name="mode" value="sheet" /> Sheet music
            </label>
          </div>

          <label class="title" style="margin-top:10px;">Tabs instruments</label>
          <div class="chips">
            <label class="chip"><input id="guitarChk" type="checkbox" checked /> Guitar</label>
            <label class="chip"><input id="bassChk"   type="checkbox" checked /> Bass</label>
            <label class="chip"><input id="pianoChk"  type="checkbox" /> Piano</label>
            <label class="chip"><input id="drumsChk"  type="checkbox" /> Drums</label>
          </div>

          <label class="title" style="margin-top:10px;">Export formats</label>
          <div class="chips">
            <label class="chip"><input id="fmt-md"   type="checkbox" checked /> Markdown</label>
            <label class="chip"><input id="fmt-txt"  type="checkbox" /> Plain text</label>
            <label class="chip"><input id="fmt-json" type="checkbox" /> JSON</label>
            <label class="chip"><input id="fmt-vtt"  type="checkbox" /> WebVTT</label>
          </div>

          <label class="title" style="margin-top:10px;">Chord segmentation</label>
          <div class="chips">
            <span class="chip">
              Force split
              <select id="forceSplit" style="margin-left:6px; background:#020617; color:var(--ink); border-radius:8px; border:1px solid #1f2937; padding:3px 8px;">
                <option value="0">auto</option>
                <option value="2">every 2s</option>
                <option value="4">every 4s</option>
                <option value="8">every 8s</option>
              </select>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- LYRICS + OUTPUT + LOG -->
  <div class="card">
    <div class="pad">
      <div class="row">
        <div>
          <label class="title">Lyrics (optional)</label>
          <textarea id="lyrics" placeholder="Paste lyrics here to embed chords in a ChordPro-style section."></textarea>

          <label class="title" style="margin-top:10px;">Output preview</label>
          <div id="scoreWrap" style="display:none;">
            <canvas id="scoreCanvas" width="1000" height="220"></canvas>
          </div>
          <pre id="preview" class="preview">(nothing yet)</pre>

          <div class="actions">
            <button id="renderBtn" class="btn sec" disabled>Render / Download</button>
          </div>
        </div>
        <div>
          <label class="title">Log</label>
          <pre id="log"></pre>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
/* ========== DOM refs ========== */
const fileEl       = document.getElementById('file');
const dropEl       = document.getElementById('drop');
const pickBtn      = document.getElementById('pickBtn');
const fnameEl      = document.getElementById('fname');
const analyzeBtn   = document.getElementById('analyzeBtn');
const abortBtn     = document.getElementById('abortBtn');
const progressFill = document.getElementById('progressFill');
const statusEl     = document.getElementById('status');
const lyricsEl     = document.getElementById('lyrics');
const previewEl    = document.getElementById('preview');
const logEl        = document.getElementById('log');
const scoreWrap    = document.getElementById('scoreWrap');
const scoreCanvas  = document.getElementById('scoreCanvas');

const guitarChk    = document.getElementById('guitarChk');
const bassChk      = document.getElementById('bassChk');
const pianoChk     = document.getElementById('pianoChk');
const drumsChk     = document.getElementById('drumsChk');

const fmtMd        = document.getElementById('fmt-md');
const fmtTxt       = document.getElementById('fmt-txt');
const fmtJSON      = document.getElementById('fmt-json');
const fmtVTT       = document.getElementById('fmt-vtt');
const forceSplitEl = document.getElementById('forceSplit');

const getMode = () => (document.querySelector('input[name="mode"]:checked')?.value || 'tabs');

/* ========== Tiny utils ========== */
function setProgress(p){
  progressFill.style.width = Math.max(0, Math.min(100, p)) + '%';
}
const tick = () => new Promise(r => setTimeout(r, 0));

function makeLog(el){
  let buffer = [];
  let scheduled = false;
  return (msg) => {
    buffer.push(msg);
    if (!scheduled){
      scheduled = true;
      setTimeout(() => {
        const prefix = el.textContent ? '\\n' : '';
        el.textContent += prefix + buffer.join('\\n');
        el.scrollTop = el.scrollHeight;
        buffer = [];
        scheduled = false;
      }, 40);
    }
  };
}
const log = makeLog(logEl);

const pad = (n,l=2) => String(n).padStart(l,'0');
const fmtTime = (t) => {
  const m  = Math.floor(t/60);
  const s  = Math.floor(t%60);
  const ms = Math.round((t - Math.floor(t))*1000);
  return \`\${pad(m)}:\${pad(s)}.\${pad(ms,3)}\`;
};

log('🎵 Music page script loaded.');

/* ========== File state & UX ========== */
let currentFile = null;
let abortCtrl   = null;
let analyzed    = null;   // { title, duration, spans:[{start,end,label}], bpm, key }

function setCurrentFile(file){
  currentFile = file || null;
  fnameEl.textContent = currentFile ? (currentFile.name || '') : 'No file selected.';
}

/* Native file picker */
fileEl.addEventListener('change', () => {
  const file = fileEl.files && fileEl.files[0] ? fileEl.files[0] : null;
  log('File chosen: ' + (file ? file.name : 'none'));
  setCurrentFile(file);
});

/* Click on drop area (except inner button) */
dropEl.addEventListener('click', (e) => {
  if (e.target === pickBtn) return;
  fileEl.value = '';
  fileEl.click();
});

/* Browse button */
pickBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  fileEl.value = '';
  fileEl.click();
});

/* Keyboard on drop area */
dropEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' '){
    e.preventDefault();
    fileEl.value = '';
    fileEl.click();
  }
});

/* Drag & drop */
dropEl.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropEl.classList.add('drag');
});
dropEl.addEventListener('dragleave', () => {
  dropEl.classList.remove('drag');
});
dropEl.addEventListener('drop', (e) => {
  e.preventDefault();
  dropEl.classList.remove('drag');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    const file = e.dataTransfer.files[0];
    log('Dropped file: ' + file.name);
    setCurrentFile(file);
  }
});

/* ========== Audio decoding (Web Audio) ========== */
async function decodeToMono(arrayBuf){
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) throw new Error('Web Audio not supported in this browser.');
  const ctx = new AC();
  const audio = await ctx.decodeAudioData(arrayBuf.slice(0));
  const sr = audio.sampleRate;
  const len = audio.length;
  const ch  = audio.numberOfChannels;
  const mono = new Float32Array(len);
  for (let c = 0; c < ch; c++){
    const data = audio.getChannelData(c);
    for (let i = 0; i < len; i++){
      mono[i] += data[i] / ch;
    }
  }
  await ctx.close();
  return { sr, mono, duration: audio.duration };
}

/* simple framing – we’ll attach fake chord labels for now */
function frameForChords(mono, sr){
  const hop = 2048;
  const hopSec = hop / sr;
  const frames = Math.floor(mono.length / hop);
  const spans = [];
  const labels = ['C','G','Am','F','Dm','Em'];
  for (let i = 0; i < frames; i++){
    const start = i * hopSec;
    const end   = (i+1) * hopSec;
    const label = labels[i % labels.length]; // placeholder progression
    spans.push({ start, end, label });
  }
  return { spans, hop };
}

/* merge tiny spans and optionally force length */
function mergeSpans(spans, minDur = 0.35, forcedSec = 0){
  if (!spans.length) return spans;
  const merged = [];
  for (const s of spans){
    if (!merged.length){
      merged.push({ ...s });
      continue;
    }
    const last = merged[merged.length-1];
    if (last.label === s.label){
      last.end = s.end;
    } else if ((s.end - s.start) <= minDur){
      last.end = s.end;
    } else {
      merged.push({ ...s });
    }
  }
  if (!forcedSec || forcedSec <= 0) return merged;
  const forced = [];
  for (const m of merged){
    let t = m.start;
    while (t < m.end){
      const e = Math.min(m.end, t + forcedSec);
      forced.push({ start:t, end:e, label:m.label });
      t = e;
    }
  }
  return forced;
}

function guessKey(spans){
  if (!spans.length) return '—';
  const weight = {};
  for (const s of spans){
    weight[s.label] = (weight[s.label] || 0) + (s.end - s.start);
  }
  const best = Object.entries(weight).sort((a,b)=>b[1]-a[1])[0];
  return best ? best[0] + ' (rough)' : '—';
}

/* ========== Tabs helpers (human-ish) ========== */
function padLine(arr, width, fill='-'){
  while (arr.length < width) arr.push(fill);
}
function makeLines(template){
  return template.split('\\n').map(s => s.split(''));
}
function joinLines(lines){
  return lines.map(a => a.join('')).join('\\n');
}

// guitar chord shapes [e, B, G, D, A, E]
const GUITAR_SHAPES = {
  'C':['0','1','0','2','3','x'],
  'G':['3','0','0','0','2','3'],
  'D':['2','3','2','0','x','x'],
  'Em':['0','0','0','2','2','0'],
  'Am':['0','1','2','2','0','x'],
  'F':['1','1','2','3','3','1'],
  'E':['0','0','1','2','2','0'],
  'A':['0','2','2','2','0','x']
};

function simplifyChord(label){
  label = (label || '').trim();
  const m = label.match(/^([A-G][b#]?)(.*)$/);
  if (!m) return label || 'C';
  const root = m[1];
  const rest = (m[2] || '').toLowerCase();
  const isMinor = rest.startsWith('m') && !rest.startsWith('maj');
  return root + (isMinor ? 'm' : '');
}
function guitarShape(label){
  const key = simplifyChord(label);
  return GUITAR_SHAPES[key] || GUITAR_SHAPES['C'];
}

function guitarTabsFromSpans(spans){
  let lines = makeLines(
    "e|----------------|----------------|----------------|\n"+
    "B|----------------|----------------|----------------|\n"+
    "G|----------------|----------------|----------------|\n"+
    "D|----------------|----------------|----------------|\n"+
    "A|----------------|----------------|----------------|\n"+
    "E|----------------|----------------|----------------|"
  );
  if (!spans.length) return joinLines(lines);
  const total = spans[spans.length-1].end || 1;
  for (const s of spans){
    const shape = guitarShape(s.label);
    const col = 2 + Math.floor((s.start / total) * 70);
    lines.forEach(line => padLine(line, col+2, '-'));
    for (let i = 0; i < 6; i++){
      const fret = shape[i];
      if (!fret || fret === 'x') continue;
      lines[i][col] = fret;
    }
  }
  return joinLines(lines);
}

function bassTabsFromSpans(spans){
  let lines = makeLines(
    "G|----------------|----------------|----------------|\n"+
    "D|----------------|----------------|----------------|\n"+
    "A|----------------|----------------|----------------|\n"+
    "E|----------------|----------------|----------------|"
  );
  if (!spans.length) return joinLines(lines);
  const total = spans[spans.length-1].end || 1;
  let toggle = false;
  for (const s of spans){
    const col = 2 + Math.floor((s.start / total) * 70);
    lines.forEach(line => padLine(line, col+2, '-'));
    const row = toggle ? 2 : 3; // A or E
    toggle = !toggle;
    lines[row][col] = '3';
  }
  return joinLines(lines);
}

function pianoHintsFromSpans(spans){
  if (!spans.length) return ["RH: —","LH: —"];
  const names = spans.map(s => simplifyChord(s.label));
  return [
    "RH: " + names.map(n => n.endsWith('m') ? n.replace('m','')+"m triad" : n+" triad").join("   "),
    "LH: " + names.map(n => n.replace('m','')+"2").join("   ")
  ];
}
function drumHints(){
  const patt = (k) => Array.from({length:16},(_,i)=>k(i)?'x':'-').join('');
  return [
    "Kick | "  + patt(i => i%4===0),
    "Snare| " + patt(i => i%8===4),
    "HH   | " + patt(i => i%2===0)
  ];
}

/* ========== Exports ========== */
function chordProFromSpansAndLyrics(spans, lyricsText, totalSec){
  if (!spans.length || !lyricsText) return null;
  const words = lyricsText.trim().split(/\s+/);
  if (!words.length) return null;
  const per = totalSec / words.length;
  let res = '';
  let idx = 0;
  for (let i = 0; i < words.length; i++){
    const t = i * per;
    while (idx+1 < spans.length && spans[idx+1].start <= t) idx++;
    const addChord = (i === 0) || (spans[idx].start <= t && spans[idx].start > (i-1)*per);
    res += (addChord ? '['+spans[idx].label+']' : '') + words[i] + ((i+1)%12===0 ? "\\n" : " ");
  }
  return res.trim();
}

function toMarkdown(title, spans, g, b, p, d, chordPro){
  const out = [];
  out.push('# '+(title||'Song')+' — Tabs & Chords','');
  if (chordPro){
    out.push('## Lyrics + Chords','```chordpro', chordPro, '```','');
  }
  if (g){ out.push('## Guitar','```',g,'```',''); }
  if (b){ out.push('## Bass','```',b,'```',''); }
  if (p && p.length){
    out.push('## Piano');
    p.forEach(line => out.push('- '+line));
    out.push('');
  }
  if (d && d.length){
    out.push('## Drum Grid');
    d.forEach(line => out.push('`'+line+'`'));
    out.push('');
  }
  out.push('## Chord Timeline','');
  spans.forEach(s => {
    out.push('- '+fmtTime(s.start)+'–'+fmtTime(s.end)+': **'+s.label+'**');
  });
  out.push('');
  return out.join('\\n');
}

function toPlainText(g,b,p,d){
  const out = [];
  if (g){ out.push('GUITAR',g,''); }
  if (b){ out.push('BASS',b,''); }
  if (p && p.length){
    out.push('PIANO');
    out.push(...p);
    out.push('');
  }
  if (d && d.length){
    out.push('DRUMS');
    out.push(...d);
    out.push('');
  }
  return out.join('\\n');
}

function toJSONFile(title, spans, meta){
  return JSON.stringify({ title, chords:spans, meta }, null, 2);
}

function toWebVTT(spans){
  const out = ['WEBVTT',''];
  const fmt = (t) => {
    const h  = Math.floor(t/3600);
    const m  = Math.floor((t%3600)/60);
    const s  = Math.floor(t%60);
    const ms = Math.round((t - Math.floor(t))*1000);
    const p2 = (n)=>String(n).padStart(2,'0');
    const p3 = (n)=>String(n).padStart(3,'0');
    return \`\${p2(h)}:\${p2(m)}:\${p2(s)}.\${p3(ms)}\`;
  };
  spans.forEach(s => {
    out.push(\`\${fmt(s.start)} --> \${fmt(s.end)}\`, s.label, '');
  });
  return out.join('\\n');
}

function downloadText(name, text, type='text/plain'){
  const blob = new Blob([text], { type });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 1200);
}

/* ========== VexFlow lead sheet (melody stub) ========== */
let VF = null;
async function loadVexFlowOnce(){
  if (VF) return VF;
  const mod = await import('https://unpkg.com/vexflow@4.2.4/build/esm/vexflow.js');
  VF = mod.Flow || mod;
  return VF;
}
function pitchToVexKey(midi){
  const names = ['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'];
  const step  = names[midi % 12];
  const oct   = Math.floor(midi/12) - 1;
  return \`\${step}/\${oct}\`;
}
function quantizeBeats(beats){
  const table = [
    { dur:'w',  beats:4 },
    { dur:'h',  beats:2 },
    { dur:'q',  beats:1 },
    { dur:'8',  beats:0.5 },
    { dur:'16', beats:0.25 }
  ];
  let best = table[0], bestDiff = Infinity;
  for (const t of table){
    const diff = Math.abs(t.beats - beats);
    if (diff < bestDiff){ bestDiff = diff; best = t; }
  }
  return best;
}
function syllabify(text){
  if (!text) return [];
  const words = text.trim().split(/\s+/);
  const out   = [];
  for (const w of words){
    const parts = w.split(/(?<=[aeiouyAEIOUY])/);
    for (const p of parts) if (p) out.push(p);
  }
  return out;
}

async function renderSheet({ title, spans, lyrics, bpm=100 }){
  const Flow = await loadVexFlowOnce();
  const canvas = scoreCanvas;
  const ctx    = canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const renderer = new Flow.Renderer(canvas, Flow.Renderer.Backends.CANVAS);
  renderer.resize(canvas.width, canvas.height);
  const context = renderer.getContext();
  context.setFont('Arial', 12, '').setFillStyle('#e5e7eb');

  const stave = new Flow.Stave(30, 40, canvas.width-60);
  stave.addClef('treble').addTimeSignature('4/4');
  stave.setContext(context).draw();

  const notes = [];
  const beatsPerSec = bpm/60;
  const melody = spans.slice(0, Math.min(12, spans.length)).map(s => {
    // fake melody: chord root as pitch around middle C
    const rootIndex = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'].indexOf(simplifyChord(s.label).replace('m',''));
    const midi = 60 + (rootIndex >= 0 ? rootIndex : 0); // C4 + interval
    return { start:s.start, end:s.end, midi };
  });

  if (!melody.length){
    notes.push(new Flow.StaveNote({ keys:['c/4'], duration:'w' }));
  } else {
    for (const n of melody){
      const durBeats = (n.end - n.start)*beatsPerSec || 1;
      const q = quantizeBeats(durBeats);
      const key = pitchToVexKey(n.midi);
      notes.push(new Flow.StaveNote({ keys:[key], duration:q.dur }));
    }
  }

  // lyrics under notes
  const sylls = syllabify(lyrics);
  const max   = Math.min(sylls.length, notes.length);
  for (let i=0;i<max;i++){
    const ann = new Flow.Annotation(sylls[i])
      .setFont('Arial',11)
      .setVerticalJustification(Flow.Annotation.VerticalJustify.BOTTOM);
    notes[i].addAnnotation(0, ann);
  }

  const voice = new Flow.Voice({ num_beats:4, beat_value:4 });
  voice.addTickables(notes);
  new Flow.Formatter().joinVoices([voice]).format([voice], canvas.width-80);
  voice.draw(context, stave);

  // draw chord labels above
  context.save();
  context.setFont('12px Arial');
  const secToBeats = (sec) => (sec * bpm) / 60;
  spans.forEach(s => {
    const beat = secToBeats(s.start);
    const rel  = (beat % 4) / 4;
    const x    = 30 + rel * (canvas.width-60);
    const y    = stave.getYForTopText() - 6;
    context.fillText(s.label, x, y);
  });
  context.restore();
}

/* ========== Analyze button ========== */
analyzeBtn.addEventListener('click', analyzeOnce);
abortBtn.addEventListener('click', () => abortCtrl?.abort());

async function analyzeOnce(){
  try{
    if (!currentFile) throw new Error('No file selected.');
    const mb = currentFile.size / (1024*1024);
    if (mb > 200) throw new Error('File too large (limit 200 MB).');

    abortCtrl = new AbortController();
    analyzeBtn.disabled = true;
    abortBtn.disabled   = false;
    renderBtn.disabled  = true;
    previewEl.textContent = '';
    scoreWrap.style.display = 'none';
    logEl.textContent = '';
    setProgress(5);
    statusEl.textContent = 'Decoding audio…';

    const buf = await currentFile.arrayBuffer();
    const dec = await decodeToMono(buf);
    if (dec.duration > 600) throw new Error('Audio too long (limit 600 seconds).');

    setProgress(25);
    statusEl.textContent = 'Estimating chords…';

    // For now: fake chord spans with a simple progression (placeholder).
    const framed = frameForChords(dec.mono, dec.sr);
    const forced = Number(forceSplitEl.value || 0);
    const merged = mergeSpans(framed.spans, 0.35, forced);

    const title = (currentFile.name || 'Song').replace(/\.[^.]+$/,'');
    const key   = guessKey(merged);
    const bpm   = 100;

    analyzed = { title, duration:dec.duration, spans:merged, bpm, key };
    log('Spans: '+merged.length);
    merged.slice(0,8).forEach(s => {
      log(\`[\${fmtTime(s.start)}–\${fmtTime(s.end)}] \${s.label}\`);
    });

    statusEl.textContent = 'Analysis complete (placeholder chords).';
    setProgress(80);
    renderBtn.disabled = false;
  }catch(err){
    if (err.name === 'AbortError'){
      log('⚠️ Analysis aborted.');
      statusEl.textContent = 'Canceled.';
    } else {
      log('❌ '+err.message);
      statusEl.textContent = 'Failed.';
    }
  }finally{
    analyzeBtn.disabled = false;
    abortBtn.disabled   = true;
    abortCtrl           = null;
    setProgress(100);
  }
}

/* ========== Render / download ========== */
const modeRadios = document.querySelectorAll('input[name="mode"]');
modeRadios.forEach(r => r.addEventListener('change', () => { if (analyzed) renderFromAnalysis(); }));

const renderBtn = document.getElementById('renderBtn');
renderBtn.addEventListener('click', () => {
  if (!analyzed){
    alert('Analyze first.');
    return;
  }
  renderFromAnalysis(true);
});

async function renderFromAnalysis(download=false){
  if (!analyzed || !analyzed.spans || !analyzed.spans.length){
    previewEl.textContent = '(no chord data)';
    return;
  }
  const spans    = analyzed.spans;
  const duration = analyzed.duration;
  const mode     = getMode();

  const g = guitarChk.checked ? guitarTabsFromSpans(spans) : null;
  const b = bassChk.checked   ? bassTabsFromSpans(spans)   : null;
  const p = pianoChk.checked  ? pianoHintsFromSpans(spans) : null;
  const d = drumsChk.checked  ? drumHints()                : null;
  const chordPro = chordProFromSpansAndLyrics(spans, (lyricsEl.value || '').trim(), duration);

  if (mode === 'sheet'){
    scoreWrap.style.display = 'block';
    previewEl.textContent   = '';
    try{
      await renderSheet({
        title: analyzed.title,
        spans,
        lyrics: (lyricsEl.value || '').trim(),
        bpm: analyzed.bpm || 100
      });
    }catch(err){
      log('⚠️ Sheet render failed: '+err.message);
      scoreWrap.style.display = 'none';
    }
  } else {
    scoreWrap.style.display = 'none';
    const mdPreview = toMarkdown(analyzed.title, spans, g, b, p, d, chordPro);
    previewEl.textContent = mdPreview;
  }

  if (!download) return;

  if (fmtMd.checked){
    const md = toMarkdown(analyzed.title, spans, g, b, p, d, chordPro);
    downloadText(\`\${analyzed.title||'song'}-tabs.md\`, md, 'text/markdown');
  }
  if (fmtTxt.checked){
    const txt = toPlainText(g,b,p,d);
    downloadText(\`\${analyzed.title||'song'}-tabs.txt\`, txt);
  }
  if (fmtJSON.checked){
    const meta = { key: analyzed.key, bpm: analyzed.bpm, duration };
    const json = toJSONFile(analyzed.title, spans, meta);
    downloadText(\`\${analyzed.title||'song'}-chords.json\`, json, 'application/json');
  }
  if (fmtVTT.checked){
    const vtt = toWebVTT(spans);
    downloadText(\`\${analyzed.title||'song'}-chords.vtt\`, vtt, 'text/vtt');
  }
}

/* ========== Init ========== */
setProgress(0);
statusEl.textContent = 'Idle.';
</script>
