<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberChat Assistant</title>
  <style>
    body {
      background: #0f1117;
      color: #e5e7eb;
      font-family: "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding-top: 80px;
    }
    h1 {
      color: #7dd3fc;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      color: #9aa4b2;
      max-width: 600px;
      margin: 0 auto 20px;
    }
    footer {
      position: fixed;
      bottom: 16px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 0.8rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <h1>CyberChat AI Assistant 🤖</h1>
  <p>Click the glowing bubble in the corner to chat.  
     Run the local AI server (FastAPI) if you want to use offline models and plugins.</p>

  <!-- CyberChat Widget -->
  <script src="assets/cyberchat-widget.js"
          data-endpoint="http://127.0.0.1:8000"
          data-title="EvolveBot"
          data-primary="#7dd3fc"
          data-accent="#a78bfa"
          data-position="right"
          data-greeting="Hey! Need a hand?"
          data-voice="auto"
          defer></script>

  <footer>CyberChat v2 — © FileConverter.run Labs</footer>
</body>
</html>
