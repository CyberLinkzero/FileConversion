<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SNES Emulator – Load Your Own ROM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    margin: 0; padding: 20px;
    background: #020617; color: #e5e7eb;
    font-family: system-ui;
  }
  h1 { margin-top: 0; }
  #game {
    width: 100%;
    max-width: 800px;
    aspect-ratio: 4 / 3;
    margin-top: 20px;
    background: #000;
    border: 2px solid #1e293b;
    border-radius: 12px;
  }
  #loadBtn {
    background: #00eaff;
    border: none;
    padding: 12px 22px;
    font-size: 18px;
    border-radius: 999px;
    cursor: pointer;
    color: #020617;
    font-weight: bold;
  }
  #status { margin-top: 10px; color: #9ca3af; font-size: 14px; }
</style>
</head>
<body>

<h1>SNES Emulator</h1>
<p>Click the button below to load your own ROM (.smc / .sfc)</p>

<button id="loadBtn">🎮 Load SNES ROM</button>
<input type="file" id="romInput" accept=".smc,.sfc" style="display:none;">

<div id="game"></div>

<p id="status">Waiting for ROM…</p>

<script>
  // EmulatorJS global configuration
  window.EJS_player = "#game";  
  window.EJS_core = "snes";      
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_language = "en";
  window.EJS_onGameStart = () => {
    document.getElementById("status").textContent = "Game running!";
  };

  // Create emulator but do NOT load a ROM yet
  const script = document.createElement("script");
  script.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
  document.body.appendChild(script);

  // Load button handler
  const loadBtn = document.getElementById("loadBtn");
  const romInput = document.getElementById("romInput");

  loadBtn.onclick = () => {
    romInput.click();
  };

  // When user picks a ROM
  romInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById("status").textContent = "Loading ROM…";

    const buffer = await file.arrayBuffer();
    const bytes = new Uint8Array(buffer);

    // Send ROM to EmulatorJS
    window.postMessage({
      type: "ejs-load-rom",
      name: file.name,
      data: bytes
    }, "*");

    document.getElementById("status").textContent =
      "ROM loaded! Click inside screen, then press Enter to start.";
  };
</script>

</body>
</html>
